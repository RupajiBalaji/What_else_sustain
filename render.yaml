# Render Blueprint Specification for What Else Sustain
# https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: what-else-sustain-db
    databaseName: what_else_sustain
    user: sustain_user
    region: oregon
    plan: free

services:
  - type: web
    name: what-else-sustain
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: "npm install && npm run build && cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: ALLOWED_ORIGINS
        value: "https://what-else-sustain.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: what-else-sustain-db
          property: connectionString
      # Secure secret keys configured in the Render Dashboard modal on launch
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
